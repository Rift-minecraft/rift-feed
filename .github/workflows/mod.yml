name: Rift-Mod bauen
on:
  workflow_dispatch:
  push:
    paths: ['mod-src/**', '.github/workflows/mod.yml']
permissions:
  contents: write
jobs:
  fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - name: Fabric-Vorlage für ${{ matrix.mc }} holen (liefert die passenden Versionen)
        run: git clone --depth 1 --branch ${{ matrix.mc }} https://github.com/FabricMC/fabric-example-mod tpl
      - name: Rift-Code einsetzen
        run: |
          cd tpl
          rm -rf src
          mkdir -p src/main/java src/main/resources
          cp -r ../mod-src/common/java/* src/main/java/
          cp -r ../mod-src/fabric/java/* src/main/java/
          cp -r ../mod-src/fabric/resources/* src/main/resources/
          # Offizielle Mojang-Namen verwenden (der Code nutzt diese)
          sed -i -E 's/^(\s*)mappings .*/\1mappings loom.officialMojangMappings()/' build.gradle
          # Vorlage trennt evtl. Client/Server-Quellen: aufheben, damit alles in src/main liegt
          sed -i -E '/splitEnvironmentSourceSets\(\)/d' build.gradle
          # Mod-Block der Vorlage (referenziert sourceSets.client) entfernen
          python3 - <<'PY'
          import re
          s=open('build.gradle').read()
          s=re.sub(r'\n\s*mods\s*\{.*?\n\s*\}\n\s*\}', '\n', s, flags=re.S) if 'sourceSets.client' in s else s
          open('build.gradle','w').write(s)
          PY
          echo "mod_version=1.0.0" >> gradle.properties
          sed -i -E 's/^archives_base_name=.*/archives_base_name=rift-${{ matrix.mc }}-fabric/' gradle.properties
          sed -i -E 's/^mod_version=.*/mod_version=1.0.0/' gradle.properties
          cat build.gradle
      - name: Bauen
        run: |
          cd tpl
          chmod +x gradlew
          ./gradlew build --no-daemon > ../build.log 2>&1 || {
            python3 -c "import sys;t=open('../build.log',errors='replace').read()[-6000:];print('::error title=Gradle-Fehler::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
            exit 1
          }
      - name: Klassen untersuchen (Diagnose)
        if: always()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged*.jar' -o -name 'minecraft-client*.jar' 2>/dev/null | head -3)
          echo "$J" > inspect.txt
          for j in $J; do
            for c in net.minecraft.client.gui.Gui net.minecraft.client.gui.components.BossHealthOverlay net.minecraft.client.renderer.entity.LivingEntityRenderer net.minecraft.client.model.HumanoidModel net.minecraft.client.model.PlayerModel net.minecraft.client.multiplayer.PlayerInfo net.minecraft.world.entity.Entity net.minecraft.client.Minecraft net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.GuiGraphics net.minecraft.network.chat.Style net.minecraft.client.gui.Font net.minecraft.client.renderer.entity.state.EntityRenderState net.minecraft.client.renderer.entity.state.LivingEntityRenderState net.minecraft.client.renderer.entity.AvatarRenderer net.minecraft.client.gui.screens.inventory.InventoryScreen net.minecraft.client.renderer.entity.EntityRenderer net.minecraft.network.chat.FontDescription net.minecraft.network.chat.FontDescription\$Resource net.minecraft.client.gui.components.EditBox net.minecraft.world.entity.player.Player net.minecraft.client.player.AbstractClientPlayer net.minecraft.client.renderer.entity.state.AvatarRenderState net.minecraft.client.renderer.entity.state.HumanoidRenderState net.minecraft.client.gui.components.PlayerFaceRenderer net.minecraft.client.gui.render.state.GuiRenderState; do
              echo "=== $c"; javap -p -cp "$j" $c 2>&1 | head -600
            done
          done > inspect.txt 2>&1 || true
      - name: Diagnose veroeffentlichen
        if: always()
        run: |
          mkdir ../ins && cp inspect.txt ../ins/ && cd ../ins && git init -q && git checkout -q -b inspect && git add . && git -c user.name=ci -c user.email=ci@x commit -qm inspect && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" inspect
      - name: Release "mod-latest" aktualisieren
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          JAR=$(ls tpl/build/libs/*.jar | grep -v -- '-sources' | head -1)
          cp "$JAR" rift-${{ matrix.mc }}-fabric.jar
          gh release view mod-latest >/dev/null 2>&1 || gh release create mod-latest --title "Rift-Mod (automatisch)" --notes "Wird automatisch gebaut."
          gh release upload mod-latest rift-${{ matrix.mc }}-fabric.jar --clobber
      - uses: actions/upload-artifact@v4
        with: { name: 'rift-${{ matrix.mc }}-fabric', path: 'rift-${{ matrix.mc }}-fabric.jar' }

  neoforge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: NeoForge-Vorlage holen
        run: git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-${{ matrix.mc }}-ModDevGradle tpl
      - name: Rift-Code einsetzen
        run: |
          cd tpl
          rm -rf src
          mkdir -p src/main/java src/main/resources src/main/templates
          cp -r ../mod-src/common/java/* src/main/java/
          cp -r ../mod-src/neoforge/java/* src/main/java/
          cp -r ../mod-src/neoforge/resources/* src/main/resources/
          cp -r ../mod-src/neoforge/templates/* src/main/templates/
          sed -i -E 's/^mod_id=.*/mod_id=rift/; s/^mod_name=.*/mod_name=Rift Client/; s/^mod_group_id=.*/mod_group_id=de.rift.mod/' gradle.properties
          sed -i -E "s/^\s*archivesName = .*/    archivesName = 'rift-${{ matrix.mc }}-neoforge'/" build.gradle
          sed -i -E 's/^org.gradle.configuration-cache=.*/org.gradle.configuration-cache=false/' gradle.properties
          sed -i '/downloadSources/d;/downloadJavadoc/d' build.gradle
      - name: Bauen
        run: |
          cd tpl
          chmod +x gradlew
          ./gradlew build --no-daemon > ../build.log 2>&1 || {
            python3 -c "import sys;t=open('../build.log',errors='replace').read()[-6000:];print('::error title=Gradle-Fehler::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
            exit 1
          }
      - name: Release "mod-latest" aktualisieren
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          JAR=$(ls tpl/build/libs/*.jar | grep -v -- '-sources' | head -1)
          cp "$JAR" rift-${{ matrix.mc }}-neoforge.jar
          gh release view mod-latest >/dev/null 2>&1 || gh release create mod-latest --title "Rift-Mod (automatisch)" --notes "Wird automatisch gebaut."
          gh release upload mod-latest rift-${{ matrix.mc }}-neoforge.jar --clobber
      - uses: actions/upload-artifact@v4
        with: { name: 'rift-${{ matrix.mc }}-neoforge', path: 'rift-${{ matrix.mc }}-neoforge.jar' }
