<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: data: blob:">
<title>Rift Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8d8d97"/></linearGradient></defs></svg>
<div id="app">
  <aside id="sidebar">
    <div class="logo" title="Rift Launcher"><img src="logo.png" alt="Rift Launcher"><span>RIFT<br>LAUNCHER</span></div>
    <nav>
      <button class="hwtile" id="hwTile" data-view="pass" style="display:none"><svg class="hwp" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M7 1h2v2H7z" fill="#4ade80"/><path d="M3 4h10v2H2v4h1v2h2v1h6v-1h2v-2h1V6h-1V4z" fill="#f97316"/><path d="M4 6h2v2H4zM10 6h2v2h-2zM5 10h6v1H5z" fill="#1a0b00"/></svg><span class="hwt"><b>HALLOWEEN</b><small id="hwSub">Battle Pass</small><i class="hwbar"><u id="hwFill"></u></i></span></button>
      <button class="nav active" data-view="play"><svg viewBox="0 0 24 24"><path d="M8 5.6v12.800a1 1 0 0 0 1.500.86l10.600-6.400a1 1 0 0 0 0-1.720L9.500 4.740A1 1 0 0 0 8 5.600z"/></svg><span>Play</span></button>
      <button class="nav" data-view="profiles"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm4.500 4a2.300 2.300 0 1 0 0 4.600 2.300 2.300 0 0 0 0-4.600zM5 17c0-2.100 1.700-3.300 3.500-3.300S12 14.900 12 17zm8-8.500h6v1.800h-6zm0 3.500h6v1.800h-6zm0 3.500h4v1.800h-4z"/></svg><span>Profile</span></button>
      <button class="nav" data-view="mods"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="14.200" y="14.200" width="5.600" height="5.600" rx="1.400" transform="rotate(45 17 17)"/></svg><span>Mods</span></button>
      <button class="nav" data-view="skins"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2.500 6v3h3V9zm6 0v3h3V9zM8 15.500v2h8v-2z"/></svg><span>Skins</span></button>
      <button class="nav" data-view="capes"><svg viewBox="0 0 24 24"><path d="M8.500 2.500h7l1.700 2.600 3.300 2.200-1 13.700a1 1 0 0 1-1.350.86L12 19.700l-6.150 2.160a1 1 0 0 1-1.350-.86L3.500 7.300l3.300-2.200z"/></svg><span>Capes</span></button>
      <button class="nav" data-view="media"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 6h3l1.500-2h7L17 6h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm8 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg><span>Medien</span></button>
      <button class="nav" data-view="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg><span>Stats</span></button>
      <button class="nav" data-view="cosmetics"><svg viewBox="0 0 24 24"><path d="M10 2.500l2.100 6 6 2.100-6 2.100-2.100 6-2.100-6-6-2.100 6-2.100zM18.500 14l1 2.700 2.700 1-2.700 1-1 2.700-1-2.700-2.700-1 2.700-1z"/></svg><span>Cosmetics</span></button>
      <button class="nav" data-view="crates"><svg viewBox="0 0 24 24"><path d="M12 2 3 6.500v10L12 21l9-4.500v-10zM12 4.300l5.800 2.900L12 10 6.200 7.200zM5 8.800l6 3v6.600l-6-3zm8 9.600v-6.600l6-3v6.600z"/></svg><span>Crates</span></button>
      <button class="nav" data-view="shop"><svg viewBox="0 0 24 24"><path d="M5.400 8.500h13.200l1.200 12a1 1 0 0 1-1 1.100H5.200a1 1 0 0 1-1-1.100z"/><path class="st" d="M8.500 10V7.500a3.500 3.500 0 0 1 7 0V10"/></svg><span>Shop</span></button>
      <button class="nav" data-view="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c.5-3.800 3-6 6.500-6s6 2.200 6.500 6z"/><circle cx="17.500" cy="9" r="2.500"/><path d="M17 14.200c2.700.2 4.200 2 4.600 5.800H18z"/></svg><span>Freunde</span></button>
      <button class="nav" data-view="plus" id="plusNav" style="display:none"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 9l-5 4.4L17.500 20 12 16.500 6.500 20 8 13.400 3 9l6.600-.4z"/></svg><span>Rift+</span></button>
    <div id="adminNav" style="display:none"><div class="navlabel">ADMIN</div>
      <button class="nav" data-view="admin_update"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zm7-16-6 6h4v6h4v-6h4z"/></svg><span>Update</span></button>
      <button class="nav" data-view="admin_news"><svg viewBox="0 0 24 24"><path d="M3 10v4h3l5 4V6L6 10zm13.500 2a4.500 4.500 0 0 0-2.500-4v8a4.500 4.500 0 0 0 2.500-4z"/></svg><span>Popups</span></button>
      <button class="nav" data-view="admin_setup"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V7a3 3 0 0 1 3-3z"/></svg><span>Setup</span></button>
    </div>
    </nav>
    <button class="nav gear" data-view="settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
  </aside>

  <header id="topbar">
    <div class="brand"><b>RIFT LAUNCHER</b><small>v1.0.0</small></div>
    <div class="spacer"></div>
    <div class="pill off" id="offPill" style="display:none" title="Offline – du kannst nur starten"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8" fill="currentColor"/><path class="slash" d="M3 3l18 18"/></svg></div>
    <div class="pill" id="coinPill" title="Rift Coins"><span class="coin"></span><b id="coinCount">0</b></div>
    <div class="pill btn" id="giftPill" title="Daily Gift"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 7h-2.200A3 3 0 0 0 12 4.600 3 3 0 0 0 6.200 7H4a1 1 0 0 0-1 1v3h18V8a1 1 0 0 0-1-1zM9 7a1 1 0 1 1 2 0zm4 0a1 1 0 1 1 2 0zM4 13v6a2 2 0 0 0 2 2h5v-8zm9 0v8h5a2 2 0 0 0 2-2v-6z"/></svg></div>
    <div class="pill btn" id="wrapPill" style="display:none" title="Rift Wrapped"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 0C12 7 17 12 24 12C17 12 12 17 12 24C12 17 7 12 0 12C7 12 12 7 12 0Z"/></svg></div>
    <div class="pill btn" id="updPill" style="display:none"></div>
    <div class="pill btn" id="profilePill">KEIN PROFIL</div>
    <div class="pill btn account" id="accountPill"><img id="accountHead" alt=""><span id="accountName">Nicht eingeloggt</span></div>
    <div class="winctl">
      <button data-win="min">–</button><button data-win="max">▢</button><button data-win="close">✕</button>
    </div>
  </header>

  <main id="content"></main>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="popup" class="hidden"></div>
  <div id="login" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="maint" class="hidden"></div>
</div>

<script src="setup-ui.js"></script>
